<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Granular Panel</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header class="bar">
    <strong>Granular DevTools</strong>
    <span id="status" class="status">disconnected</span>
    <span class="spacer"></span>
    <button id="btn-attach">Attach</button>
    <button id="btn-snapshot">Snapshot</button>
    <button id="btn-reset">Reset</button>
    <button id="btn-detach">Detach</button>
  </header>

  <main class="grid">
    <section class="card">
      <h3>Stats</h3>
      <div id="stats" class="stats">No data yet.</div>
    </section>

    <section class="card">
      <h3>Top hosts (last 2s)</h3>
      <table class="grid-table">
        <thead><tr><th>Host</th><th>Count</th><th>Total ms</th><th>Avg ms</th></tr></thead>
        <tbody id="top-hosts"></tbody>
      </table>
    </section>

    <section class="card span-2">
      <h3>Recent events</h3>
      <table class="grid-table">
        <thead><tr><th>Time</th><th>Type</th><th>Host</th><th>Priority</th><th>Elapsed</th></tr></thead>
        <tbody id="events"></tbody>
      </table>
    </section>
  </main>

  <script src="panel.js"></script>
</body>
</html>
